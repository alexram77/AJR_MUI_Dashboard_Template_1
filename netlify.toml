# Netlify deployment for the demo app.
# Build command produces a static SPA in dist/; the redirect keeps client-side
# routing working on deep links (e.g. /charts opened directly).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
