# Publish the demo to GitHub Pages on every push to main.
#
# Live at https://alexram77.github.io/AJR_MUI_Dashboard_Template_1/ with no
# account anywhere but GitHub.
#
# REQUIRES A PUBLIC REPOSITORY on GitHub Free. Pages serves private repos only
# on Pro/Team/Enterprise; otherwise this builds fine and then fails at
# configure-pages with "Get Pages site failed: Not Found". Netlify and Vercel
# both serve a public site from a private repo for free -- see the README.
#
# If you fork this, the one setting that cannot be automated is
# Settings -> Pages -> Source -> "GitHub Actions". The Pages site has to exist
# before an Actions deploy can target it, and the Actions token is not allowed
# to create one. Flip it once; every push after that publishes on its own.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you publish a branch without merging, from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # A project site is served from /<repo>/, so the asset URLs and the
        # router basename both need that prefix.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add SPA fallback
        # Pages has no rewrite rules, so a deep link like /charts would 404.
        # Serving index.html as the 404 page hands routing back to the SPA.
        run: cp dist/index.html dist/404.html

      # Reads the Pages config (base path, origin) for the upload step.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
